<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar senha — Chiptronic TravelOps</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/logo-mark.svg" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/tables.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/logo-mark.svg" alt="Chiptronic TravelOps" class="auth-logo-img" onerror="this.style.display='none';this.nextElementSibling?.classList.remove('hidden');">
        <div class="auth-logo-fallback hidden">
          <div class="brand-mark">CT</div>
          <span>Chiptronic TravelOps</span>
        </div>
      </div>
      <h1>Recuperar senha</h1>
      <p class="subtitle">Informe seu e-mail corporativo</p>
      <div id="alert" class="alert alert-error hidden"></div>

      <form id="forgot-form" class="form-grid">
        <div>
          <label for="email">E-mail</label>
          <input id="email" type="email" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar link</button>
      </form>

      <hr class="mt-3" style="border:none;border-top:1px solid var(--border)" />

      <h2 style="font-size:1.1rem;margin:1rem 0 0.5rem">Redefinir com token</h2>
      <p class="text-muted" style="margin:0 0 1rem;font-size:0.9rem">
        No MVP o token é exibido na resposta (sem e-mail real).
      </p>
      <form id="reset-form" class="form-grid">
        <div>
          <label for="token">Token</label>
          <input id="token" required />
        </div>
        <div>
          <label for="password">Nova senha</label>
          <div class="password-field" data-password-field>
            <input id="password" type="password" required minlength="6" data-password-input />
            <button type="button" class="password-toggle" data-password-toggle aria-label="Mostrar senha">👁</button>
          </div>
        </div>
        <div>
          <label for="password_confirm">Confirmar senha</label>
          <div class="password-field" data-password-field>
            <input id="password_confirm" type="password" required minlength="6" data-password-input />
            <button type="button" class="password-toggle" data-password-toggle aria-label="Mostrar senha">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-secondary btn-block">Redefinir senha</button>
      </form>

      <div class="form-footer">
        <a href="login.html">Voltar ao login</a>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script type="module" src="js/forgot.js"></script>
</body>
</html>
