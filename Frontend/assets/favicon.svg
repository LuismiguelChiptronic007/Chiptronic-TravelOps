<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="arrows" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="textg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="white" opacity=".08"/>

  <!-- Arrow top (pointing LEFT, like the logo) -->
  <path d="M18 16 L10 16 L10 13 L3 19 L10 25 L10 22 L20 22 Q27 22 32 16" stroke="url(#arrows)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#soft)"/>
  <path d="M18 16 L10 16 L10 13 L3 19 L10 25 L10 22 L20 22 Q27 22 32 16" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".85"/>

  <!-- Arrow bottom (pointing RIGHT, like the logo) -->
  <path d="M46 48 L54 48 L54 51 L61 45 L54 39 L54 42 L44 42 Q37 42 32 48" stroke="url(#arrows)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#soft)"/>
  <path d="M46 48 L54 48 L54 51 L61 45 L54 39 L54 42 L44 42 Q37 42 32 48" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".85"/>

  <!-- C letter -->
  <g transform="translate(12 15)">
    <path d="M22 0 L22 7 L14 7 Q8 7 8 17 Q8 27 14 27 L22 27 L22 34 L12 34 Q2 34 2 22 Q2 10 12 10 L22 10 Z" fill="white" opacity=".96"/>
  </g>

  <!-- Inner highlight -->
  <rect x="2" y="2" width="60" height="22" rx="12" fill="white" opacity=".08"/>
</svg>
