<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>TravelOps - Sem conexao</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: #0a0a0a; color: #f8fafc; text-align: center; }
    main { max-width: 24rem; }
    img { width: 5rem; height: 5rem; object-fit: contain; margin-bottom: 1rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
    p { margin: 0; color: #a1a1aa; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icone.png" alt="TravelOps">
    <h1>Voce esta sem conexao</h1>
    <p>Conecte-se novamente para carregar esta pagina. Dados salvos localmente serao sincronizados quando a internet voltar.</p>
  </main>
</body>
</html>
