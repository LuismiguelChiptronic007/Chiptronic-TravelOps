<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa Operacional — Chiptronic TravelOps</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/logo-mark.svg" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/tables.css" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <style>
      #mapa-wrap {
        position: relative;
        width: 100%;
        height: calc(100vh - var(--topbar-h) - 2rem);
        min-height: 520px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border-subtle);
        background: var(--surface-2);
      }
      #mapa {
        width: 100%;
        height: 100%;
        background: #111827;
      }
      html[data-theme="dark"] #mapa {
        background: #0f172a;
      }

      .mapa-layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 1rem;
        align-items: start;
      }
      @media (max-width: 960px) {
        .mapa-layout {
          grid-template-columns: 1fr;
        }
        #mapa-wrap {
          height: 420px;
          min-height: 360px;
        }
      }

      .sidebar-panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-height: calc(100vh - var(--topbar-h) - 2rem);
        overflow: hidden;
      }
      .panel-scroll {
        overflow-y: auto;
        padding-right: 4px;
        flex: 1;
        min-height: 0;
      }

      .alertas-topo {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 500;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .alerta-badge {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        backdrop-filter: blur(8px);
        box-shadow: var(--shadow-md);
      }
      .alerta-badge.pendentes {
        background: rgba(202, 138, 4, 0.92);
        color: #fff;
      }
      .alerta-badge.atencao {
        background: rgba(185, 28, 28, 0.92);
        color: #fff;
      }
      .atualizado-em {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 500;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(15, 23, 42, 0.82);
        color: #e5e7eb;
        backdrop-filter: blur(8px);
        box-shadow: var(--shadow-sm);
      }

      .marker-pin {
        background: transparent;
        border: none;
      }
      .marker-card {
        min-width: 170px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
        box-shadow:
          0 14px 40px -10px rgba(0, 0, 0, 0.35),
          0 4px 10px -4px rgba(0, 0, 0, 0.2);
        position: relative;
        font-family: var(--font);
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .marker-card:hover {
        transform: translateY(-2px);
        box-shadow:
          0 18px 48px -10px rgba(0, 0, 0, 0.45),
          0 6px 14px -4px rgba(0, 0, 0, 0.25);
      }
      .marker-card::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -10px;
        transform: translateX(-50%);
        border: 10px solid transparent;
        border-top-color: var(--border);
        border-top-width: 10px;
      }
      .marker-card::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        transform: translateX(-50%);
        border: 9px solid transparent;
        border-top-color: var(--surface);
        z-index: 1;
      }
      .marker-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
        line-height: 1.2;
      }
      .marker-status {
        display: inline-flex;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        flex-shrink: 0;
        box-shadow: 0 0 0 2px var(--surface);
      }
      .status-em_andamento {
        background: #16a34a;
      }
      .status-pendente {
        background: #ca8a04;
      }
      .status-sem_atividade {
        background: #2563eb;
      }
      .status-atencao {
        background: #dc2626;
      }
      .status-concluida {
        background: #64748b;
      }

      .marker-sub {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.35;
      }

      .avatar-pin {
        position: relative;
        width: 46px;
        height: 58px;
      }
      .avatar-pin .pin-photo {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        border: 3px solid var(--surface);
        box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.4);
        box-sizing: border-box;
      }
      .avatar-pin .pin-initials {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        background: var(--gradient-2);
        border: 3px solid var(--surface);
        box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.4);
        box-sizing: border-box;
      }
      .avatar-pin .pin-tail {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-top-width: 12px;
        border-top-style: solid;
      }
      .avatar-pin .pin-dot {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 13px;
        height: 13px;
        border-radius: 999px;
        box-shadow: 0 0 0 2px var(--surface);
      }

      .popup-body {
        font-family: var(--font);
        color: var(--text);
        min-width: 260px;
        max-width: 320px;
      }
      .popup-body h4 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 700;
      }
      .popup-body .p-section {
        margin: 10px 0;
        padding-top: 8px;
        border-top: 1px solid var(--border-subtle);
      }
      .popup-body .p-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        margin-bottom: 2px;
        font-weight: 600;
      }
      .popup-body .p-value {
        font-size: 13.5px;
        color: var(--text-2);
        font-weight: 500;
      }
      .popup-body .metricas-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .popup-body .metrica {
        background: var(--surface-alt);
        border-radius: 10px;
        padding: 6px 4px;
        text-align: center;
      }
      .popup-body .metrica .num {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
      }
      .popup-body .metrica .lbl {
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }
      .popup-body .p-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .popup-body .p-actions a,
      .popup-body .p-actions button {
        flex: 1;
        text-align: center;
        padding: 7px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: all 0.15s var(--ease);
      }
      .popup-body .p-actions a.primary {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .popup-body .p-actions a:hover,
      .popup-body .p-actions button:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
      }
      html[data-theme="dark"] .popup-body .p-actions a.primary {
        background: #f8fafc;
        color: #0b0d10;
        border-color: #f8fafc;
      }
      html[data-theme="dark"] .popup-body .p-actions a.primary:hover {
        background: #e2e8f0;
        border-color: #e2e8f0;
      }

      .atividade-item {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background: var(--surface);
        cursor: pointer;
        transition: all 0.15s var(--ease);
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .atividade-item:hover {
        background: var(--surface-alt);
        border-color: var(--border);
        transform: translateY(-1px);
        box-shadow: var(--shadow-xs);
      }
      .atividade-item .avatar {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: var(--gradient-2);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        flex-shrink: 0;
      }
      .atividade-item .info .nome {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.2;
      }
      .atividade-item .info .sub {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .atividade-item .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        box-shadow: 0 0 0 3px var(--surface);
      }
      .filter-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .filter-row label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.3px;
      }
      .filter-row select,
      .filter-row input {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .filter-row select:focus,
      .filter-row input:focus {
        border-color: var(--brand);
        box-shadow: var(--shadow-focus);
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        border-radius: 12px;
        background: var(--surface-alt);
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-2);
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .leaflet-popup-content {
        margin: 14px 16px;
      }
      .leaflet-control-attribution {
        background: rgba(15, 23, 42, 0.85) !important;
        color: #cbd5e1 !important;
        font-size: 10px !important;
      }
      .leaflet-control-attribution a {
        color: #93c5fd !important;
      }
      .leaflet-control-zoom a {
        background: var(--surface) !important;
        color: var(--text) !important;
        border-color: var(--border) !important;
      }
    </style>
    <script type="module" src="js/theme.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar"></header>
      <main class="container">
        <div class="page-header">
          <div>
            <h1>Mapa Operacional</h1>
            <p>
              Visualize em tempo real a localiza&ccedil;&atilde;o e atividade
              dos integrantes em viagens ativas.
            </p>
          </div>
        </div>

        <div class="mapa-layout">
          <aside class="panel sidebar-panel">
            <div class="panel-header">
              <h2>Filtros</h2>
            </div>
            <div class="panel-body" style="padding-bottom: 8px">
              <div class="filter-row" style="margin-bottom: 10px">
                <label for="filter-viagem">Viagem</label>
                <select id="filter-viagem">
                  <option value="">Todas as viagens ativas</option>
                </select>
              </div>
              <div class="filter-row" style="margin-bottom: 10px">
                <label for="filter-worktype">Tipo de trabalho</label>
                <select id="filter-worktype">
                  <option value="">Todos os tipos</option>
                </select>
              </div>
              <div class="legend" style="margin-top: 8px">
                <div class="legend-item">
                  <span class="legend-dot" style="background: #16a34a"></span>Em
                  andamento
                </div>
                <div class="legend-item">
                  <span class="legend-dot" style="background: #ca8a04"></span
                  >Pend&ecirc;ncia
                </div>
                <div class="legend-item">
                  <span class="legend-dot" style="background: #2563eb"></span
                  >Sem atividade
                </div>
                <div class="legend-item">
                  <span class="legend-dot" style="background: #dc2626"></span
                  >Aten&ccedil;&atilde;o
                </div>
                <div class="legend-item">
                  <span class="legend-dot" style="background: #64748b"></span
                  >Conclu&iacute;da
                </div>
              </div>
            </div>

            <div
              class="panel-header"
              style="border-top: 1px solid var(--border-subtle)"
            >
              <h2>Atividade atual</h2>
              <span id="integrantes-count" class="chip chip-muted">0</span>
            </div>
            <div class="panel-body panel-scroll" id="atividade-lista">
              <div class="empty-state">Carregando…</div>
            </div>
          </aside>

          <section>
            <div id="mapa-wrap">
              <div class="alertas-topo" id="alertas-topo"></div>
              <div class="atualizado-em" id="atualizado-em">—</div>
              <div id="mapa"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="js/mapa-operacional.js"></script>
  </body>
</html>
